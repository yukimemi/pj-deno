# Deno-layer variables. Merged into the consumer's `.kata/vars.toml`
# via `[[file]] how = "merge-toml"`, composing with pj-base's
# universal pins (actions/checkout, peter-evans/create-pull-request,
# anthropics/claude-code-action).
#
# Each `# renovate:` annotation tells Renovate which datasource and
# upstream repo the value tracks; Renovate bumps these via the
# customManager declared in pj-base's `default.json`. Bumps land in
# this template repo's source file and in each consumer's
# `.kata/vars.toml` independently.

[actions]
# renovate: datasource=github-tags depName=denoland/setup-deno
deno_setup = "v2"

[deno]
# Passed to `denoland/setup-deno` as `deno-version`. Pinned
# explicitly rather than relying on the action's default, which has
# moved before (`1.x` -> `2.x`) and would silently change the
# toolchain under every consumer at once. Accepts a semver range, an
# exact version, `lts`, or `canary`.
#
# CONSUMER-OWNED: seeded once on first apply, never overwritten.
version = "2.x"

# Runners the CI matrix fans out over. The full three is the default
# because Deno code that shells out or touches paths breaks on
# Windows in ways Linux never shows.
#
# Trim it for a project that genuinely only targets one OS — a
# single-platform scraper, a JSR library with no filesystem surface.
# Note the required status check follows the FIRST leg's name
# (`ci (<os>)`), so dropping `ubuntu-latest` means updating branch
# protection too.
#
# CONSUMER-OWNED: seeded once on first apply, never overwritten.
os_matrix = ["ubuntu-latest", "macos-latest", "windows-latest"]
